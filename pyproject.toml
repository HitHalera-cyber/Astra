[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "astra"
version = "1.0.0"
description = "Русскоязычный комплекс термодинамических расчётов на базе NASA CEA"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "cea==3.3.4",
    # NumPy 2.4+ для x86-64 собран под x86-64-v2 (SSSE3, SSE4.1/4.2, POPCNT) и не загружается
    # на процессорах без этих команд, например AMD Phenom II («сбой в программе инициализации
    # библиотеки DLL»). 2.3.x требует только SSE3. См. tests/test_cpu_baseline.py.
    "numpy>=2.0,<2.4",
    "pyqtgraph>=0.13.7",
    "openpyxl>=3.1",
    # PySide6 6.12.0 на Python 3.11 ошибочно уменьшает счётчик ссылок None при каждом
    # вызове метода без возвращаемого значения, и приложение со временем аварийно
    # завершается (на 3.12+ объект None бессмертен). См. tests/test_gui.py.
    "PySide6>=6.6,<6.12; python_version < '3.12'",
    "PySide6>=6.6; python_version >= '3.12'",
]

[project.gui-scripts]
astra = "astra.app.main:main"

[project.optional-dependencies]
test = ["pytest>=8", "markdown>=3.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"astra.data" = ["thermo.inp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
